name: YouTube to Telegram

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'YouTube URL'
        required: true

jobs:
  download-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp
          
      - name: Download with proxy
        run: |
          yt-dlp \
            --proxy "socks5://user:pass@proxy-server:1080" \
            -f "best[height<=360]" \
            --max-filesize 50M \
            -o "video.%(ext)s" \
            "${{ github.event.inputs.url }}"
            
      - name: Upload to Telegram
        run: |
          curl -F "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
               -F "video=@$(ls *.mp4 *.webm 2>/dev/null | head -1)" \
               "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo"
